name: Generate cell animation

on:
  # runs every day at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # lets you run it by hand in the Actions tab
  workflow_dispatch:
  # runs again when the repository changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # draws the cell engulfing the contribution graph (light and dark versions)
      - name: Generate the SVGs
        run: python3 scripts/cell_animation.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publishes the images in the "output" branch, used by the README
      - name: Push the SVGs to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update cell animation"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
